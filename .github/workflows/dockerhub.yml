name: Docker Hub

on:
  push:
    branches:
      - feature/leonardo-login
  pull_request:
    branches:
      - feature/leonardo-login

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código - probando
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Login a Docker Hub - probando
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_LEONARDO }}
          password: ${{ secrets.DOCKER_TOKEN_LEONARDO }}

      # 3. Build y Push con tags latest y SHA - probando deploy
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_LEONARDO }}/mi-tercer:latest
            ${{ secrets.DOCKER_HUB_LEONARDO }}/mi-tercer-action:${{ github.sha }}