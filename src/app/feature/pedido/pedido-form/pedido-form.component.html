<div class="pedido-form">
  <h2>Registrar Venta</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row">
      <mat-form-field appearance="outline" class="field" style="width:100%">
        <mat-label>Cliente*</mat-label>
        <mat-select formControlName="customerId">
          <mat-option *ngFor="let c of customers" [value]="c.idUsuario">{{c.firstName}} {{c.lastName}} ({{c.email}})</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="row">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Tipo de Pago</mat-label>
        <mat-select formControlName="paymentType">
          <mat-option value="EFECTIVO">EFECTIVO</mat-option>
          <mat-option value="TARJETA">TARJETA</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>Tipo de Comprobante</mat-label>
        <mat-select formControlName="receiptType">
          <mat-option value="BOLETA">BOLETA</mat-option>
          <mat-option value="FACTURA">FACTURA</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="products">
      <div class="products-header">
        <div>Producto</div>
        <div>Cantidad</div>
        <div></div>
      </div>

      <div *ngFor="let item of items.controls; let i = index" class="product-row">
        <mat-form-field appearance="outline" class="product-select">
          <mat-label>Producto</mat-label>
          <mat-select [formControl]="getControl(item, 'productId')">
            <mat-option *ngFor="let p of products" [value]="p.idProduct">{{p.name}} ({{p.unitPrice | currency:'S/.'}})</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="product-qty">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" [formControl]="getControl(item, 'quantity')" (blur)="normalizeQuantity('quantity', i)" min="1" />
          <mat-error *ngIf="getControl(item, 'quantity').hasError('pattern')">Cantidad inválida</mat-error>
        </mat-form-field>

        <div class="product-actions">
          <button mat-icon-button color="warn" (click)="removeRow(i)" type="button" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <div class="form-footer">
        <div class="footer-left">
          <button mat-flat-button color="accent" class="btn-add-product" type="button" (click)="addRow()">Agregar producto</button>
        </div>
        <div class="footer-right">
          <button mat-flat-button color="primary" type="submit">Agregar</button>
          <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
        </div>
      </div>
    </div>
  </form>
</div>
